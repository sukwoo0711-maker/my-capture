name: Packaged Windows validation

on:
  push:
    branches:
      - agent/v1.8.0-completion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  EXPECTED_SOURCE_SHA: ${{ github.sha }}

jobs:
  packaged-validation:
    name: Exact-source package and seven native self-tests
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Verify source and record hosted session
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid event source SHA.' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Checkout does not match the event SHA.' }
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Packaging requires clean source.' }
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version.Length -gt 64 -or $version -cnotmatch '\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z') { throw 'Package version must be a stable numeric SemVer.' }
          "PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path artifacts/validation/hosted -Force | Out-Null
          [ordered]@{
            SourceCommit = $head
            Version = $version
            WindowsVersion = [Environment]::OSVersion.Version.ToString()
            UserInteractive = [Environment]::UserInteractive
            SessionId = (Get-Process -Id $PID).SessionId
            Explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId)
            ExistingMyCapture = @(Get-Process -Name MyCapture -ErrorAction SilentlyContinue | Select-Object Id, SessionId)
          } | ConvertTo-Json -Depth 4 | Set-Content artifacts/validation/hosted/session.json -Encoding utf8
          Get-Content artifacts/validation/hosted/session.json

      - name: Build Release
        run: .\build\build.ps1 -Configuration Release

      - name: Package clean source
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path artifacts/validation/hosted/package.log | Out-Null
          try { .\build\package.ps1 -Version $env:PACKAGE_VERSION }
          finally { Stop-Transcript | Out-Null }

      - name: Run all seven packaged self-tests
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path artifacts/validation/hosted/packaged-self-tests.log | Out-Null
          try {
            .\build\run-packaged-self-tests.ps1 -PublishRoot "artifacts/release/$env:PACKAGE_VERSION/publish-win-x64" -OutputRoot artifacts/validation/hosted/packaged-self-tests
          }
          finally { Stop-Transcript | Out-Null }

      - name: Verify installer and update lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path artifacts/validation/hosted/installer-update-tests.log | Out-Null
          function Invoke-CheckedTest([string]$Path, [string[]]$TestArguments = @()) {
            # Negative-case harnesses intentionally run failing child commands. Give
            # each harness its own host so its internal LASTEXITCODE cannot leak into
            # the Actions wrapper after all assertions have passed.
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Path @TestArguments
            if ($LASTEXITCODE -ne 0) { throw "Validation failed ($LASTEXITCODE): $Path" }
          }
          try {
            Invoke-CheckedTest .\build\tests\installer-resident-tests.ps1
            Invoke-CheckedTest .\build\tests\installer-hostile-tests.ps1 @('-Version', $env:PACKAGE_VERSION, '-ArtifactRoot', "artifacts/release/$env:PACKAGE_VERSION")
            Invoke-CheckedTest .\build\tests\update-helper-tests.ps1
            Invoke-CheckedTest .\build\tests\update-preservation-tests.ps1
            Invoke-CheckedTest .\build\tests\update-restart-preflight-tests.ps1
            Invoke-CheckedTest .\build\tests\update-restart-acceptance.ps1 @('-ArtifactRoot', "artifacts/release/$env:PACKAGE_VERSION", '-ExpectedSourceCommit', $env:EXPECTED_SOURCE_SHA, '-DotNetPath', (Get-Command dotnet).Source, '-Execute')
          }
          finally { Stop-Transcript | Out-Null }

      - name: Verify release provenance and preserve seven reports
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Source SHA changed.' }
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Source tree changed during validation.' }
          $releaseRoot = "artifacts/release/$env:PACKAGE_VERSION"
          $manifest = Get-Content "$releaseRoot/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.SourceCommit -cne $env:EXPECTED_SOURCE_SHA -or
              $manifest.SourceTreeClean -isnot [bool] -or -not $manifest.SourceTreeClean -or
              $manifest.Version -cne $env:PACKAGE_VERSION) { throw 'Release provenance mismatch.' }
          $assetNames = @(
            "MyCapture-$env:PACKAGE_VERSION-win-x64-setup.exe",
            "MyCapture-$env:PACKAGE_VERSION-win-x64-portable.zip",
            'installer-manifest.json', 'release-manifest.json', 'SHA256SUMS.txt', 'README-OFFLINE.txt'
          )
          $assets = @($assetNames | ForEach-Object {
            $file = Get-Item -LiteralPath (Join-Path $releaseRoot $_)
            if ($file.PSIsContainer -or $file.Length -le 0) { throw "Missing release asset: $_" }
            [pscustomobject]@{ Path = $_; Bytes = $file.Length; Sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $sums = @(Get-Content "$releaseRoot/SHA256SUMS.txt")
          $expectedSums = @($assets | Where-Object { $_.Path -in @($assetNames[0], $assetNames[1], 'release-manifest.json') } | ForEach-Object { "$($_.Sha256.ToUpperInvariant())  $($_.Path)" })
          if ($sums.Count -ne 3 -or @(Compare-Object $expectedSums $sums -CaseSensitive).Count -ne 0) { throw 'Release checksum mismatch.' }
          $runs = @(Get-ChildItem artifacts/validation/hosted/packaged-self-tests -Directory)
          if ($runs.Count -ne 1) { throw 'Expected exactly one packaged validation run.' }
          $reportPaths = @(
            'capture/selftest-report.txt', 'shell/shell-selftest-report.txt',
            'advanced/advanced-selftest-report.txt', 'settings/settings-selftest-report.txt',
            'ocr/ocr-selftest-report.txt', 'recording/recording-selftest-report.txt',
            'video-editor/video-editor-selftest-report.txt'
          )
          $reports = @($reportPaths | ForEach-Object {
            $report = Join-Path $runs[0].FullName $_
            $results = @(Get-Content -LiteralPath $report -Encoding utf8 | Where-Object { $_.StartsWith('RESULT:', [StringComparison]::Ordinal) })
            if ($results.Count -ne 1 -or $results[0] -cne 'RESULT: PASS') { throw "Packaged report did not pass: $_" }
            [pscustomobject]@{ Path = $_; Result = $results[0]; Sha256 = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [ordered]@{
            SourceCommit = $head; SourceTreeClean = $true; Version = $env:PACKAGE_VERSION
            Result = 'PASS'; PackagedSelfTests = $reports; ReleaseAssets = $assets
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/validation/hosted/validation.json -Encoding utf8
          "Packaged validation: PASS (7/7), source $head, version $env:PACKAGE_VERSION" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload six validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MyCapture-${{ env.PACKAGE_VERSION }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/release/${{ env.PACKAGE_VERSION }}/MyCapture-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe
            artifacts/release/${{ env.PACKAGE_VERSION }}/MyCapture-${{ env.PACKAGE_VERSION }}-win-x64-portable.zip
            artifacts/release/${{ env.PACKAGE_VERSION }}/installer-manifest.json
            artifacts/release/${{ env.PACKAGE_VERSION }}/release-manifest.json
            artifacts/release/${{ env.PACKAGE_VERSION }}/SHA256SUMS.txt
            artifacts/release/${{ env.PACKAGE_VERSION }}/README-OFFLINE.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload synthetic validation logs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-validation-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/logs/*.log
            artifacts/validation/hosted/*.json
            artifacts/validation/hosted/*.log
            artifacts/validation/hosted/packaged-self-tests/**/*report.txt
            artifacts/validation/update-restart/*/acceptance-result.json
            artifacts/validation/update-restart/*/verified-install-result.json
            artifacts/validation/update-restart/*/restart-process.json
            artifacts/validation/update-restart/*/seed-install.log
            artifacts/validation/update-restart/*/restart.stdout.txt
            artifacts/validation/update-restart/*/restart.stderr.txt
            artifacts/validation/update-restart/*/temporary/**/ux-review-selftest-report.txt
          if-no-files-found: warn
          retention-days: 14
