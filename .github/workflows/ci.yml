name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Build and test
        shell: powershell
        run: .\build\build.ps1 -Configuration Release -Test

      - name: Require hosted file-symlink regressions to pass
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredTests = @(
              'MyCapture.App.Tests.GalleryBatchDragTests.FinalSourceSymlinkIsRejected_AndExternalTargetIsPreserved'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Ocr_DownloadFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Translation_DownloadFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Ocr_FinalFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Translation_FinalFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.TranslationNativeLoadPathBoundaryTests.DefaultFactoryRejectsCatalogLeafSymlinkBeforeNativeLoad'
              'MyCapture.App.Tests.TranslationNativeLoadPathBoundaryTests.DirectionFactoryRejectsCatalogLeafSymlinkBeforeNativeLoad'
          )
          if ($requiredTests.Count -ne 7 -or @($requiredTests | Select-Object -Unique).Count -ne 7) {
              throw 'The hosted symlink gate requires seven distinct exact test names.'
          }

          function Assert-RequiredHostedPassResults {
              param([AllowEmptyCollection()][string[]]$Lines)
              $boundaryResultFailure = '^\s*(?:Skipped|Failed)\s+MyCapture\.App\.Tests\.(?:ModelDownloadPathBoundaryTests|TranslationNativeLoadPathBoundaryTests)\.'
              $boundaryDiagnosticFailure = '^\s*\[xUnit\.net[^\]]*\]\s+MyCapture\.App\.Tests\.(?:ModelDownloadPathBoundaryTests|TranslationNativeLoadPathBoundaryTests)\.[^\r\n]*\[(?:FAIL|SKIP)\]\s*$'
              if (@($Lines | Where-Object { $_ -cmatch $boundaryResultFailure -or $_ -cmatch $boundaryDiagnosticFailure }).Count -ne 0) {
                  throw 'Every model-download and native-load boundary test must execute without Failed or Skipped results.'
              }
              $passed = [System.Collections.Generic.List[string]]::new()
              foreach ($testName in $requiredTests) {
                  $escaped = [regex]::Escape($testName)
                  $resultPattern = '^\s*(Passed|Skipped|Failed)\s+' + $escaped + '\s+\[[^\]\r\n]+\]\s*$'
                  $badDiagnosticPattern = '^\s*\[xUnit\.net[^\]]*\]\s+' + $escaped + '\s+\[(FAIL|SKIP)\]\s*$'
                  $results = @($Lines | Where-Object { $_ -cmatch $resultPattern })
                  $badDiagnostics = @($Lines | Where-Object { $_ -cmatch $badDiagnosticPattern })
                  if ($results.Count -ne 1 -or $results[0] -cnotmatch '^\s*Passed\s+' -or $badDiagnostics.Count -ne 0) {
                      throw "Required hosted regression must have exactly one Passed result, zero Skipped/Failed and no FAIL/SKIP diagnostic: $testName"
                  }
                  $passed.Add($results[0])
              }
              return $passed.ToArray()
          }

          # Exercise the exact parser before it can accept the real console log. These are
          # synthetic strings only; they do not create links, change privileges or run tests.
          $fixture = @($requiredTests | ForEach-Object { "  Passed $_ [1 ms]" })
          $positive = @(Assert-RequiredHostedPassResults -Lines $fixture)
          if ($positive.Count -ne 7) { throw 'Parser positive fixture did not return exactly seven results.' }
          $noisy = @('Starting test execution, please wait...', '  Failed Unrelated.Tests.Case [2 ms]') + $fixture
          if (@(Assert-RequiredHostedPassResults -Lines $noisy).Count -ne 7) { throw 'Parser noise fixture failed.' }
          $negativeCases = [System.Collections.Generic.List[object]]::new()
          $negativeCases.Add(@{ Name = 'empty log'; Lines = @() })
          for ($index = 0; $index -lt $requiredTests.Count; $index++) {
              $testName = $requiredTests[$index]
              $missing = @(for ($other = 0; $other -lt $fixture.Count; $other++) { if ($other -ne $index) { $fixture[$other] } })
              $negativeCases.Add(@{ Name = "missing $index"; Lines = $missing })
              foreach ($status in @('Skipped', 'Failed')) {
                  $changed = @($fixture)
                  $changed[$index] = "  $status $testName [1 ms]"
                  $negativeCases.Add(@{ Name = "$status $index"; Lines = $changed })
              }
              $negativeCases.Add(@{ Name = "duplicate pass $index"; Lines = @($fixture) + @($fixture[$index]) })
              foreach ($suffix in @('.Other', '(argument: 1)')) {
                  $changed = @($fixture)
                  $changed[$index] = "  Passed $testName$suffix [1 ms]"
                  $negativeCases.Add(@{ Name = "different exact name $index $suffix"; Lines = $changed })
              }
              $changed = @($fixture)
              $changed[$index] = "  Passed $($testName.ToLowerInvariant()) [1 ms]"
              $negativeCases.Add(@{ Name = "wrong case $index"; Lines = $changed })
              $changed = @($fixture)
              $changed[$index] = "  Passed $testName"
              $negativeCases.Add(@{ Name = "truncated result $index"; Lines = $changed })
              foreach ($diagnostic in @('FAIL', 'SKIP')) {
                  $negativeCases.Add(@{ Name = "conflicting xUnit $diagnostic $index";
                      Lines = @($fixture) + @("[xUnit.net 00:00:01.00]     $testName [$diagnostic]") })
              }
          }
          foreach ($boundaryClass in @('ModelDownloadPathBoundaryTests', 'TranslationNativeLoadPathBoundaryTests')) {
              foreach ($status in @('Skipped', 'Failed')) {
                  $negativeCases.Add(@{ Name = "unlisted boundary $boundaryClass $status";
                      Lines = @($fixture) + @("  $status MyCapture.App.Tests.$boundaryClass.UnlistedBoundary [1 ms]") })
              }
              foreach ($diagnostic in @('FAIL', 'SKIP')) {
                  $negativeCases.Add(@{ Name = "unlisted boundary diagnostic $boundaryClass $diagnostic";
                      Lines = @($fixture) + @("[xUnit.net 00:00:01.00] MyCapture.App.Tests.$boundaryClass.UnlistedBoundary [$diagnostic]") })
              }
          }
          foreach ($case in $negativeCases) {
              $accepted = $false
              try { $null = Assert-RequiredHostedPassResults -Lines $case.Lines; $accepted = $true }
              catch { }
              if ($accepted) { throw "Required-test parser accepted an invalid synthetic log: $($case.Name)" }
          }
          Write-Host "Required-test parser self-check: 2 positive / $($negativeCases.Count) negative fixtures passed."

          $lines = @(Get-Content -LiteralPath 'build/logs/test.log' -Encoding UTF8 -ErrorAction Stop)
          $actual = @(Assert-RequiredHostedPassResults -Lines $lines)
          if ($actual.Count -ne 7) { throw 'The real log did not produce exactly seven required pass results.' }
          $actual | ForEach-Object { Write-Host $_ }
          Write-Host 'Hosted file-symlink gate: 7 Passed, 0 Skipped, 0 Failed (Gallery 1 + model download 4 + native-load leaf 2).'

      - name: Upload source build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-source-test-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/logs/build.log
            build/logs/test.log
          if-no-files-found: warn
          retention-days: 14

  x86-compatibility:
    name: Windows x86 build and compatibility tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Test x86 app boundaries
        shell: powershell
        run: |
          dotnet test tests/MyCapture.App.Tests/MyCapture.App.Tests.csproj -c Release -r win-x86 -p:Platform=x86 -p:SelfContained=true --artifacts-path artifacts/ci-x86 --filter "FullyQualifiedName~X86CompatibilityTests|FullyQualifiedName~RecoverableCleanupTests|FullyQualifiedName~HostRequirementGateTests|FullyQualifiedName~GitHubUpdateServiceTests.CheckForUpdate|FullyQualifiedName~OcrTests.Factory_AppliesQualityStageToRequest|FullyQualifiedName~UpdatePathsTests.NumericVersionDeterminesInstallerName" --logger "trx;LogFileName=app-x86.trx" --results-directory artifacts/ci-x86/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test x86 setup boundaries
        shell: powershell
        run: |
          dotnet test tests/MyCapture.Setup.Tests/MyCapture.Setup.Tests.csproj -c Release -p:Platform=x86 -p:VSTestPlatform=x86 --artifacts-path artifacts/ci-setup-x86 --filter "FullyQualifiedName~X86ArchitectureTests|FullyQualifiedName~CompanionCleanupCannotTargetAnotherWorkerDirectory|FullyQualifiedName~SetupContractsTests.Manifest|FullyQualifiedName~SetupContractsTests.Host|FullyQualifiedName~SetupContractsTests.RuntimeProbe" --logger "trx;LogFileName=setup-x86.trx" --results-directory artifacts/ci-x86/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained x86 app
        shell: powershell
        run: |
          dotnet publish src/MyCapture.App/MyCapture.App.csproj -c Release -r win-x86 --self-contained true -p:Platform=x86 -p:PublishProfile=win-x86-self-contained --artifacts-path artifacts/ci-x86 -o artifacts/ci-x86/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'artifacts/ci-x86/publish/MyCapture.exe'))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x014c) { throw 'Published app is not x86.' }
      - name: Upload x86 test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-x86-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci-x86/results/*.trx
          if-no-files-found: warn
          retention-days: 14

  # The native Windows on ARM build. The app and its tests run as ARM64 processes on a hosted ARM64
  # runner. The setup program is x64 in the x64 and arm64 packages, so its tests run under the
  # runner's x64 emulation, which is how an ARM64 PC runs it. Steps after the build run even when
  # an earlier one fails, and the last script step lists every failed test and self-test by name.
  arm64-native:
    name: Windows ARM64 native build, tests and packaged self-tests
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Require a native ARM64 shell and SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE; Windows $([Environment]::OSVersion.Version)"
          $info = @(dotnet --info)
          $info | ForEach-Object { Write-Host $_ }
          if ($env:PROCESSOR_ARCHITECTURE -cne 'ARM64') { throw 'This job must run in a native ARM64 shell.' }
          $sdkRuntime = @($info | ForEach-Object { if ($_ -match '^\s*RID:\s+(\S+)\s*$') { $Matches[1] } })
          if ($sdkRuntime.Count -ne 1 -or $sdkRuntime[0] -cne 'win-arm64') { throw "The .NET SDK is not win-arm64: $($sdkRuntime -join ', ')" }
      - name: Build arm64 tests and the x64 setup
        id: build
        shell: powershell
        run: |
          dotnet build tests/MyCapture.App.Tests/MyCapture.App.Tests.csproj -c Release -p:Platform=arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MyCapture.Core.Tests/MyCapture.Core.Tests.csproj -c Release -p:Platform=arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MyCapture.Setup.Tests/MyCapture.Setup.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . .\build\publish-architecture.ps1
          $expected = [ordered]@{
              'tests/MyCapture.App.Tests/bin/arm64/Release/net10.0-windows10.0.22000.0/MyCapture.App.Tests.dll' = 0xAA64
              'tests/MyCapture.Core.Tests/bin/arm64/Release/net10.0-windows10.0.22000.0/MyCapture.Core.Tests.dll' = 0xAA64
              'tests/MyCapture.Setup.Tests/bin/Release/net48/MyCaptureSetup.exe' = 0x8664
              'src/MyCapture.Setup/bin/arm64/Release/net48/MyCaptureSetup.exe' = 0x8664
          }
          foreach ($path in $expected.Keys) {
              $kind = Get-PublishImageKind -Path (Join-Path $PWD $path)
              if ($null -eq $kind -or $kind.Machine -ne $expected[$path]) { throw ('{0} is not machine 0x{1:X4}.' -f $path, $expected[$path]) }
              Write-Host ('{0}: machine 0x{1:X4}' -f $path, $kind.Machine)
          }
      - name: Publish self-contained arm64 app
        id: publish
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          dotnet publish src/MyCapture.App/MyCapture.App.csproj -c Release -r win-arm64 --self-contained true -p:Platform=arm64 -p:PublishProfile=win-arm64-self-contained -o artifacts/ci-arm64/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . .\build\publish-architecture.ps1
          Assert-PublishArchitecture -PublishRoot (Join-Path $PWD 'artifacts/ci-arm64/publish') -Architecture arm64
      - name: Run the eight packaged self-tests natively
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MYCAPTURE_DATA_ROOT = Join-Path $env:RUNNER_TEMP ('MyCapture-arm64-data-' + [guid]::NewGuid().ToString('N'))
          .\build\run-packaged-self-tests.ps1 -PublishRoot artifacts/ci-arm64/publish -OutputRoot artifacts/ci-arm64/packaged-self-tests
      - name: Test Core natively
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test tests/MyCapture.Core.Tests/MyCapture.Core.Tests.csproj -c Release -p:Platform=arm64 --no-build --logger "trx;LogFileName=core-arm64.trx" --results-directory artifacts/ci-arm64/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test App natively
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          # The one excluded test loads the x64 setup assembly into the in-box Windows PowerShell,
          # which is an ARM64 process on this runner. The setup tests below cover that assembly.
          dotnet test tests/MyCapture.App.Tests/MyCapture.App.Tests.csproj -c Release -p:Platform=arm64 --no-build --filter "FullyQualifiedName!~GitHubUpdateServiceTests.DownloadedSessionPassesActualInstallerPathGuard" --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none --logger "trx;LogFileName=app-arm64.trx" --results-directory artifacts/ci-arm64/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the x64 setup under emulation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test tests/MyCapture.Setup.Tests/MyCapture.Setup.Tests.csproj -c Release --no-build --logger "trx;LogFileName=setup-x64-on-arm64.trx" --results-directory artifacts/ci-arm64/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: List failed tests and self-tests
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [System.Collections.Generic.List[string]]::new()
          $namespace = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $files = @(Get-ChildItem -Path artifacts/ci-arm64/results -Filter *.trx -File -Recurse -ErrorAction SilentlyContinue | Sort-Object Name)
          if ($files.Count -eq 0) { $lines.Add('Tests: no result file was written.') }
          foreach ($file in $files) {
              [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8
              $results = @(Select-Xml -Xml $trx -XPath '//t:UnitTestResult' -Namespace $namespace | ForEach-Object { $_.Node })
              $passed = @($results | Where-Object { $_.outcome -ceq 'Passed' })
              $skipped = @($results | Where-Object { $_.outcome -ceq 'NotExecuted' })
              $failed = @($results | Where-Object { $_.outcome -cne 'Passed' -and $_.outcome -cne 'NotExecuted' })
              $lines.Add("$($file.Name): $($results.Count) results, $($passed.Count) passed, $($skipped.Count) skipped, $($failed.Count) failed")
              # A crashed or hung test host leaves its reason here instead of a failed result.
              foreach ($text in @(Select-Xml -Xml $trx -XPath '//t:RunInfo/t:Text' -Namespace $namespace | ForEach-Object { $_.Node.InnerText.Trim() })) {
                  if ($text -like '*All tests finished running*') { continue }
                  if ($text.Length -gt 600) { $text = $text.Substring(0, 600) }
                  $lines.Add("  RUN MESSAGE $text")
              }
              foreach ($result in $failed) {
                  $message = @(([string]$result.Output.ErrorInfo.Message) -split "`r?`n" | Where-Object { $_.Trim() })
                  $first = if ($message.Count -gt 0) { $message[0].Trim() } else { '(no message)' }
                  if ($first.Length -gt 300) { $first = $first.Substring(0, 300) }
                  $lines.Add("  FAILED [$($result.outcome)] $($result.testName): $first")
              }
          }
          $runs = @(Get-ChildItem -Path artifacts/ci-arm64/packaged-self-tests -Directory -ErrorAction SilentlyContinue)
          if ($runs.Count -eq 0) { $lines.Add('Packaged self-tests: not run.') }
          foreach ($run in $runs) {
              $resultPath = Join-Path $run.FullName 'result.json'
              if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) { $lines.Add("Packaged self-tests: $($run.Name) wrote no result.json."); continue }
              $result = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $lines.Add("Packaged self-tests: $($result.Result), $($result.PassCount)/$(@($result.Tests).Count) passed; Windows projection $($result.WindowsProjection.Result)")
              foreach ($failure in @($result.Failures)) { $lines.Add("  FAILED $failure") }
              foreach ($test in @($result.Tests | Where-Object { $_.Result -cne 'RESULT: PASS' })) {
                  $report = Join-Path $run.FullName ([string]$test.Path)
                  if (Test-Path -LiteralPath $report -PathType Leaf) {
                      Write-Host "----- last lines of $($test.Path) -----"
                      Get-Content -LiteralPath $report -Encoding UTF8 -Tail 40 | ForEach-Object { Write-Host $_ }
                  }
              }
          }
          $lines | ForEach-Object { Write-Host $_ }
          @('```') + $lines.ToArray() + @('```') | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload ARM64 test results and self-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-arm64-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-arm64/results/**/*.trx
            artifacts/ci-arm64/results/**/Sequence_*.xml
            artifacts/ci-arm64/packaged-self-tests/**/*report.txt
            artifacts/ci-arm64/packaged-self-tests/**/result.json
            artifacts/ci-arm64/packaged-self-tests/**/*.log
          if-no-files-found: warn
          retention-days: 14

  # A library delete of many captures uses one Shell operation and Undo one Recycle Bin restore.
  # The canary moves the 124 directories of the 2026-11-06 report both ways through the runner's
  # real Recycle Bin, brings every one back, and fails when the batch is not faster.
  recycle-bin-canary:
    name: Windows Recycle Bin batch canary
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Move and restore 124 directories one at a time and together
        shell: powershell
        env:
          MYCAPTURE_RECYCLE_CANARY: '1'
          MYCAPTURE_RECYCLE_CANARY_COUNT: '124'
        run: |
          dotnet test tests/MyCapture.App.Tests/MyCapture.App.Tests.csproj -c Release --artifacts-path artifacts/ci-recycle-canary --filter "FullyQualifiedName=MyCapture.App.Tests.WindowsRecycleBinTests.OwnedDirectories_MoveAndRestoreTogether_FasterThanOneAtATime" --logger "trx;LogFileName=recycle-bin-canary.trx" --results-directory artifacts/ci-recycle-canary/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the canary to have run and passed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$trx = Get-Content -LiteralPath 'artifacts/ci-recycle-canary/results/recycle-bin-canary.trx' -Raw -Encoding UTF8
          $namespace = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $results = @(Select-Xml -Xml $trx -XPath '//t:UnitTestResult' -Namespace $namespace | ForEach-Object { $_.Node })
          $name = 'MyCapture.App.Tests.WindowsRecycleBinTests.OwnedDirectories_MoveAndRestoreTogether_FasterThanOneAtATime'
          if ($results.Count -ne 1 -or $results[0].testName -cne $name -or $results[0].outcome -cne 'Passed') {
              $found = @($results | ForEach-Object { "$($_.testName)=$($_.outcome)" }) -join ', '
              throw "The Recycle Bin canary must have exactly one Passed result; found: $found"
          }
          $report = @(Select-Xml -Xml $trx -XPath '//t:UnitTestResult/t:Output/t:StdOut' -Namespace $namespace | ForEach-Object { $_.Node.InnerText.Trim() })
          if ($report.Count -ne 1 -or $report[0] -notmatch '^124 directories: ') { throw 'The canary did not report its 124-directory timings.' }
          Write-Host "Recycle Bin canary passed: $($report[0])"
      - name: Upload Recycle Bin canary result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-recycle-bin-canary-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci-recycle-canary/results/*.trx
          if-no-files-found: warn
          retention-days: 14
