name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Build and test
        shell: powershell
        run: .\build\build.ps1 -Configuration Release -Test

      - name: Require hosted file-symlink regression pass
        shell: powershell
        run: |
          $testName = 'MyCapture.App.Tests.GalleryBatchDragTests.FinalSourceSymlinkIsRejected_AndExternalTargetIsPreserved'
          $resultPattern = '^\s*(Passed|Skipped|Failed)\s+' + [regex]::Escape($testName) + '\s+\[[^\]]+\]\s*$'
          $results = @(Select-String -LiteralPath 'build/logs/test.log' -Pattern $resultPattern -CaseSensitive -ErrorAction Stop)
          if ($results.Count -ne 1 -or $results[0].Line -cnotmatch '^\s*Passed\s+') {
              throw "Required hosted regression did not record exactly one Passed result: $testName"
          }
          Write-Host $results[0].Line

      - name: Upload source build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-source-test-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/logs/build.log
            build/logs/test.log
          if-no-files-found: warn
          retention-days: 14
