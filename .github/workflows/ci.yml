name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Build and test
        shell: powershell
        run: .\build\build.ps1 -Configuration Release -Test

      - name: Require hosted file-symlink regressions to pass
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredTests = @(
              'MyCapture.App.Tests.GalleryBatchDragTests.FinalSourceSymlinkIsRejected_AndExternalTargetIsPreserved'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Ocr_DownloadFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Translation_DownloadFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Ocr_FinalFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.ModelDownloadPathBoundaryTests.Translation_FinalFileLink_PreservesOutsideFiles'
              'MyCapture.App.Tests.TranslationNativeLoadPathBoundaryTests.DefaultFactoryRejectsCatalogLeafSymlinkBeforeNativeLoad'
              'MyCapture.App.Tests.TranslationNativeLoadPathBoundaryTests.DirectionFactoryRejectsCatalogLeafSymlinkBeforeNativeLoad'
          )
          if ($requiredTests.Count -ne 7 -or @($requiredTests | Select-Object -Unique).Count -ne 7) {
              throw 'The hosted symlink gate requires seven distinct exact test names.'
          }

          function Assert-RequiredHostedPassResults {
              param([AllowEmptyCollection()][string[]]$Lines)
              $boundaryResultFailure = '^\s*(?:Skipped|Failed)\s+MyCapture\.App\.Tests\.(?:ModelDownloadPathBoundaryTests|TranslationNativeLoadPathBoundaryTests)\.'
              $boundaryDiagnosticFailure = '^\s*\[xUnit\.net[^\]]*\]\s+MyCapture\.App\.Tests\.(?:ModelDownloadPathBoundaryTests|TranslationNativeLoadPathBoundaryTests)\.[^\r\n]*\[(?:FAIL|SKIP)\]\s*$'
              if (@($Lines | Where-Object { $_ -cmatch $boundaryResultFailure -or $_ -cmatch $boundaryDiagnosticFailure }).Count -ne 0) {
                  throw 'Every model-download and native-load boundary test must execute without Failed or Skipped results.'
              }
              $passed = [System.Collections.Generic.List[string]]::new()
              foreach ($testName in $requiredTests) {
                  $escaped = [regex]::Escape($testName)
                  $resultPattern = '^\s*(Passed|Skipped|Failed)\s+' + $escaped + '\s+\[[^\]\r\n]+\]\s*$'
                  $badDiagnosticPattern = '^\s*\[xUnit\.net[^\]]*\]\s+' + $escaped + '\s+\[(FAIL|SKIP)\]\s*$'
                  $results = @($Lines | Where-Object { $_ -cmatch $resultPattern })
                  $badDiagnostics = @($Lines | Where-Object { $_ -cmatch $badDiagnosticPattern })
                  if ($results.Count -ne 1 -or $results[0] -cnotmatch '^\s*Passed\s+' -or $badDiagnostics.Count -ne 0) {
                      throw "Required hosted regression must have exactly one Passed result, zero Skipped/Failed and no FAIL/SKIP diagnostic: $testName"
                  }
                  $passed.Add($results[0])
              }
              return $passed.ToArray()
          }

          # Exercise the exact parser before it can accept the real console log. These are
          # synthetic strings only; they do not create links, change privileges or run tests.
          $fixture = @($requiredTests | ForEach-Object { "  Passed $_ [1 ms]" })
          $positive = @(Assert-RequiredHostedPassResults -Lines $fixture)
          if ($positive.Count -ne 7) { throw 'Parser positive fixture did not return exactly seven results.' }
          $noisy = @('Starting test execution, please wait...', '  Failed Unrelated.Tests.Case [2 ms]') + $fixture
          if (@(Assert-RequiredHostedPassResults -Lines $noisy).Count -ne 7) { throw 'Parser noise fixture failed.' }
          $negativeCases = [System.Collections.Generic.List[object]]::new()
          $negativeCases.Add(@{ Name = 'empty log'; Lines = @() })
          for ($index = 0; $index -lt $requiredTests.Count; $index++) {
              $testName = $requiredTests[$index]
              $missing = @(for ($other = 0; $other -lt $fixture.Count; $other++) { if ($other -ne $index) { $fixture[$other] } })
              $negativeCases.Add(@{ Name = "missing $index"; Lines = $missing })
              foreach ($status in @('Skipped', 'Failed')) {
                  $changed = @($fixture)
                  $changed[$index] = "  $status $testName [1 ms]"
                  $negativeCases.Add(@{ Name = "$status $index"; Lines = $changed })
              }
              $negativeCases.Add(@{ Name = "duplicate pass $index"; Lines = @($fixture) + @($fixture[$index]) })
              foreach ($suffix in @('.Other', '(argument: 1)')) {
                  $changed = @($fixture)
                  $changed[$index] = "  Passed $testName$suffix [1 ms]"
                  $negativeCases.Add(@{ Name = "different exact name $index $suffix"; Lines = $changed })
              }
              $changed = @($fixture)
              $changed[$index] = "  Passed $($testName.ToLowerInvariant()) [1 ms]"
              $negativeCases.Add(@{ Name = "wrong case $index"; Lines = $changed })
              $changed = @($fixture)
              $changed[$index] = "  Passed $testName"
              $negativeCases.Add(@{ Name = "truncated result $index"; Lines = $changed })
              foreach ($diagnostic in @('FAIL', 'SKIP')) {
                  $negativeCases.Add(@{ Name = "conflicting xUnit $diagnostic $index";
                      Lines = @($fixture) + @("[xUnit.net 00:00:01.00]     $testName [$diagnostic]") })
              }
          }
          foreach ($boundaryClass in @('ModelDownloadPathBoundaryTests', 'TranslationNativeLoadPathBoundaryTests')) {
              foreach ($status in @('Skipped', 'Failed')) {
                  $negativeCases.Add(@{ Name = "unlisted boundary $boundaryClass $status";
                      Lines = @($fixture) + @("  $status MyCapture.App.Tests.$boundaryClass.UnlistedBoundary [1 ms]") })
              }
              foreach ($diagnostic in @('FAIL', 'SKIP')) {
                  $negativeCases.Add(@{ Name = "unlisted boundary diagnostic $boundaryClass $diagnostic";
                      Lines = @($fixture) + @("[xUnit.net 00:00:01.00] MyCapture.App.Tests.$boundaryClass.UnlistedBoundary [$diagnostic]") })
              }
          }
          foreach ($case in $negativeCases) {
              $accepted = $false
              try { $null = Assert-RequiredHostedPassResults -Lines $case.Lines; $accepted = $true }
              catch { }
              if ($accepted) { throw "Required-test parser accepted an invalid synthetic log: $($case.Name)" }
          }
          Write-Host "Required-test parser self-check: 2 positive / $($negativeCases.Count) negative fixtures passed."

          $lines = @(Get-Content -LiteralPath 'build/logs/test.log' -Encoding UTF8 -ErrorAction Stop)
          $actual = @(Assert-RequiredHostedPassResults -Lines $lines)
          if ($actual.Count -ne 7) { throw 'The real log did not produce exactly seven required pass results.' }
          $actual | ForEach-Object { Write-Host $_ }
          Write-Host 'Hosted file-symlink gate: 7 Passed, 0 Skipped, 0 Failed (Gallery 1 + model download 4 + native-load leaf 2).'

      - name: Upload source build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-source-test-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/logs/build.log
            build/logs/test.log
          if-no-files-found: warn
          retention-days: 14

  x86-compatibility:
    name: Windows x86 build and compatibility tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Test x86 app boundaries
        shell: powershell
        run: |
          dotnet test tests/MyCapture.App.Tests/MyCapture.App.Tests.csproj -c Release -r win-x86 -p:Platform=x86 -p:SelfContained=true --artifacts-path artifacts/ci-x86 --filter "FullyQualifiedName~X86CompatibilityTests|FullyQualifiedName~RecoverableCleanupTests|FullyQualifiedName~HostRequirementGateTests|FullyQualifiedName~GitHubUpdateServiceTests.CheckForUpdate|FullyQualifiedName~OcrTests.Factory_AppliesQualityStageToRequest|FullyQualifiedName~UpdatePathsTests.NumericVersionDeterminesInstallerName" --logger "trx;LogFileName=app-x86.trx" --results-directory artifacts/ci-x86/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test x86 setup boundaries
        shell: powershell
        run: |
          dotnet test tests/MyCapture.Setup.Tests/MyCapture.Setup.Tests.csproj -c Release -p:Platform=x86 -p:VSTestPlatform=x86 --artifacts-path artifacts/ci-setup-x86 --filter "FullyQualifiedName~X86ArchitectureTests|FullyQualifiedName~CompanionCleanupCannotTargetAnotherWorkerDirectory|FullyQualifiedName~SetupContractsTests.Manifest|FullyQualifiedName~SetupContractsTests.Host|FullyQualifiedName~SetupContractsTests.RuntimeProbe" --logger "trx;LogFileName=setup-x86.trx" --results-directory artifacts/ci-x86/results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained x86 app
        shell: powershell
        run: |
          dotnet publish src/MyCapture.App/MyCapture.App.csproj -c Release -r win-x86 --self-contained true -p:Platform=x86 -p:PublishProfile=win-x86-self-contained --artifacts-path artifacts/ci-x86 -o artifacts/ci-x86/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'artifacts/ci-x86/publish/MyCapture.exe'))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x014c) { throw 'Published app is not x86.' }
      - name: Upload x86 test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-x86-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci-x86/results/*.trx
          if-no-files-found: warn
          retention-days: 14
