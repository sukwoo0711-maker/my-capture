name: Diagnose video-editor self-test hang

# Diagnostic branch only. Never merged: it reproduces the intermittent packaged
# video-editor self-test hang on several hosted runners at once and keeps a heap
# dump plus all managed stacks of any hung self-test.
on:
  push:
    branches:
      - diag/video-editor-hang

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  probe:
    name: Packaged self-tests probe ${{ matrix.slot }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Record hosted session
        run: |
          $ErrorActionPreference = 'Stop'
          "TEMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [xml]$props = Get-Content Directory.Build.props -Raw
          "PACKAGE_VERSION=$([string]$props.Project.PropertyGroup.Version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path artifacts/validation/hosted -Force | Out-Null

      - name: Build Release
        run: .\build\build.ps1 -Configuration Release

      - name: Package clean source
        run: .\build\package.ps1 -Version $env:PACKAGE_VERSION

      - name: Install dump tool
        run: dotnet tool install --global dotnet-dump

      - name: Run all eight packaged self-tests with a 240-second limit
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MYCAPTURE_DATA_ROOT = Join-Path $env:TEMP ('MyCapture-validation-data-' + [guid]::NewGuid().ToString('N'))
          .\build\run-packaged-self-tests.ps1 -PublishRoot "artifacts/release/$env:PACKAGE_VERSION/publish-win-x64" -OutputRoot artifacts/validation/hosted/packaged-self-tests -TimeoutSeconds 240

      - name: Read managed stacks from hang dumps
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $dumps = @(Get-ChildItem artifacts/validation/hosted/packaged-self-tests -Recurse -Filter '*-hang.dmp' -ErrorAction SilentlyContinue)
          Write-Host "Hang dumps: $($dumps.Count)"
          if ($dumps.Count -eq 0) { exit 0 }
          $tool = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-dump.exe'
          $publish = [IO.Path]::GetFullPath("artifacts/release/$env:PACKAGE_VERSION/publish-win-x64")
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "cdb: $(if ($cdb) { $cdb.FullName } else { 'not found' })"
          foreach ($dump in $dumps) {
            $out = Join-Path $dump.DirectoryName ($dump.BaseName + '-stacks-report.txt')
            & $tool analyze $dump.FullName -c "setclrpath $publish" -c 'clrthreads' -c 'clrstack -all' -c 'exit' *> $out
            Write-Host "== $($dump.FullName) ($([math]::Round($dump.Length / 1MB)) MB) =="
            Get-Content $out | Out-Host
            if ($cdb) {
              $native = Join-Path $dump.DirectoryName ($dump.BaseName + '-native-report.txt')
              & $cdb.FullName -z $dump.FullName -c '.symfix; .reload; ~* kn 40; q' *> $native
              Get-Content $native | Out-Host
            }
          }

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: video-editor-hang-probe-${{ matrix.slot }}-${{ github.run_attempt }}
          path: |
            artifacts/validation/hosted/packaged-self-tests/**/*report.txt
            artifacts/validation/hosted/packaged-self-tests/**/result.json
          if-no-files-found: warn
          retention-days: 7
